<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聊天页面原型</title>
  <style>
    :root {
      --sidebar: #1f1e1d;
      --sidebar-muted: #8d8a80;
      --panel: #f5f4ee;
      --surface: #ffffff;
      --line: #e5e3da;
      --text: #1f1e1d;
      --muted: #6f6e69;
      --accent: #d97757;
      --accent-soft: #f7ede8;
      --warning: #cb9a4b;
      --bubble-me: #f5e9e2;
      --bubble-other: #ffffff;
      --shadow: 0 14px 36px rgba(31, 30, 29, 0.08);
      --serif: "Tiempos Text", "Times New Roman", Georgia, serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Styrene B", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: #ede9de;
    }

    .app {
      display: grid;
      grid-template-columns: 76px 320px minmax(420px, 1fr);
      width: min(1280px, calc(100vw - 32px));
      height: min(820px, calc(100vh - 32px));
      margin: 16px auto;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 10px;
      background: var(--sidebar);
      color: #fff;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent);
      font-size: 18px;
      font-weight: 700;
    }

    .nav {
      display: grid;
      gap: 18px;
      margin-top: 36px;
    }

    .nav button,
    .bottom-actions button,
    .icon-button {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 8px;
      color: inherit;
      background: transparent;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .nav button {
      color: var(--sidebar-muted);
      font-size: 20px;
    }

    .nav button.active,
    .nav button:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .bottom-actions {
      display: grid;
      gap: 10px;
      margin-top: auto;
      color: var(--sidebar-muted);
      font-size: 20px;
    }

    .contacts {
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      background: var(--panel);
      border-right: 1px solid var(--line);
    }

    .contacts-header {
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--line);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .contacts-actions {
      display: flex;
      gap: 8px;
    }

    .contacts-actions .icon-button {
      background: var(--surface);
      color: var(--muted);
      box-shadow: 0 1px 2px rgba(31, 30, 29, 0.04);
    }

    .contacts-actions .icon-button:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #efece3;
      color: var(--muted);
    }

    .search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
    }

    .contact-list {
      overflow-x: hidden;
      overflow-y: auto;
      padding: 8px;
    }

    .contact {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      width: 100%;
      min-height: 70px;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .contact:hover,
    .contact.active {
      background: var(--surface);
    }

    .contact.active {
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .contact-avatar {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #e8e4d8;
      color: #57544c;
      font-weight: 700;
    }

    .contact-main {
      min-width: 0;
    }

    .contact-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .contact-name {
      overflow: hidden;
      font-size: 15px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .contact-message {
      overflow: hidden;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .time {
      color: #9c998f;
      font-size: 12px;
      white-space: nowrap;
    }

    .badge {
      display: grid;
      place-items: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--warning);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .chat {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #faf9f5;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 74px;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .chat-person {
      min-width: 0;
    }

    .chat-person strong {
      display: block;
      overflow: hidden;
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-person span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .chat-tools {
      display: flex;
      gap: 6px;
      color: var(--muted);
      font-size: 18px;
    }

    .icon-button:hover {
      background: var(--panel);
      color: var(--text);
    }

    .messages {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 18px;
      overflow: auto;
      padding: 24px;
    }

    .day-label {
      align-self: center;
      padding: 5px 10px;
      border-radius: 999px;
      background: #efece3;
      color: var(--muted);
      font-size: 12px;
    }

    .message {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      max-width: min(70%, 620px);
    }

    .message.me {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message .contact-avatar {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      font-size: 13px;
    }

    .bubble {
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bubble-other);
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
      box-shadow: 0 4px 14px rgba(31, 30, 29, 0.04);
    }

    .message.me .bubble {
      border-color: #ecd9cd;
      background: var(--bubble-me);
    }

    .composer {
      border-top: 1px solid var(--line);
      background: var(--surface);
    }

    .composer-toolbar {
      display: flex;
      gap: 4px;
      padding: 10px 18px 0;
      color: var(--muted);
      font-size: 18px;
    }

    .composer-area {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: end;
      padding: 10px 18px 18px;
    }

    textarea {
      width: 100%;
      min-height: 74px;
      max-height: 130px;
      resize: vertical;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font: inherit;
      line-height: 1.55;
    }

    .send-button {
      height: 38px;
      min-width: 84px;
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    .send-button:hover {
      background: #c2664a;
    }

    @media (max-width: 880px) {
      .app {
        grid-template-columns: 64px 1fr;
        width: 100vw;
        height: 100vh;
        margin: 0;
        border: 0;
        border-radius: 0;
      }

      .chat {
        display: none;
      }
    }

    @media (max-width: 560px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar" aria-label="主导航">
      <div class="avatar">T</div>
      <nav class="nav">
        <button class="active" title="消息" aria-label="消息">●</button>
        <button title="联系人" aria-label="联系人">◇</button>
        <button title="收藏" aria-label="收藏">☆</button>
        <button title="文件" aria-label="文件">▣</button>
      </nav>
      <div class="bottom-actions">
        <button title="设置" aria-label="设置">⚙</button>
      </div>
    </aside>

    <section class="contacts" aria-label="联系人区域">
      <header class="contacts-header">
        <div class="title-row">
          <div class="contacts-actions" aria-label="连接操作">
            <button class="icon-button" title="刷新" aria-label="刷新">⟳</button>
            <button class="icon-button" title="二维码" aria-label="二维码">▦</button>
            <button class="icon-button" title="手动连接" aria-label="手动连接">⇄</button>
            <button class="icon-button" title="代发文件箱" aria-label="代发文件箱">▤</button>
          </div>
        </div>
      </header>

      <div class="contact-list">
        <button class="contact active" data-name="产品设计群" data-status="8 人在线">
          <span class="contact-avatar">设</span>
          <span class="contact-main">
            <span class="contact-name-row">
              <span class="contact-name">产品设计群</span>
              <span class="time">10:28</span>
            </span>
            <span class="contact-message">今天把聊天页面先搭出来，后面再接数据。</span>
          </span>
          <span class="badge">3</span>
        </button>

        <button class="contact" data-name="林夏" data-status="手机在线">
          <span class="contact-avatar">林</span>
          <span class="contact-main">
            <span class="contact-name-row">
              <span class="contact-name">林夏</span>
              <span class="time">09:42</span>
            </span>
            <span class="contact-message">我看了一下，三栏结构挺适合桌面端。</span>
          </span>
        </button>

        <button class="contact" data-name="陈远" data-status="电脑在线">
          <span class="contact-avatar">陈</span>
          <span class="contact-main">
            <span class="contact-name-row">
              <span class="contact-name">陈远</span>
              <span class="time">昨天</span>
            </span>
            <span class="contact-message">联系人列表可以加分组和置顶。</span>
          </span>
        </button>

        <button class="contact" data-name="文件传输助手" data-status="常用工具">
          <span class="contact-avatar">文</span>
          <span class="contact-main">
            <span class="contact-name-row">
              <span class="contact-name">文件传输助手</span>
              <span class="time">周五</span>
            </span>
            <span class="contact-message">已保存 3 个文件到本地。</span>
          </span>
        </button>

        <button class="contact" data-name="客服小助手" data-status="在线">
          <span class="contact-avatar">客</span>
          <span class="contact-main">
            <span class="contact-name-row">
              <span class="contact-name">客服小助手</span>
              <span class="time">周四</span>
            </span>
            <span class="contact-message">欢迎回来，有问题可以随时发送消息。</span>
          </span>
        </button>
      </div>
    </section>

    <section class="chat" aria-label="聊天详情区域">
      <header class="chat-header">
        <div class="chat-person">
          <strong id="chatName">产品设计群</strong>
          <span id="chatStatus">8 人在线</span>
        </div>
        <div class="chat-tools">
          <button class="icon-button" title="语音通话" aria-label="语音通话">☎</button>
          <button class="icon-button" title="视频通话" aria-label="视频通话">▻</button>
          <button class="icon-button" title="更多" aria-label="更多">⋯</button>
        </div>
      </header>

      <div class="messages" id="messages">
        <span class="day-label">今天 10:20</span>
        <div class="message">
          <span class="contact-avatar">林</span>
          <p class="bubble">这个页面先按 QQ 的思路做：左侧放入口，中间放会话，右侧展示聊天内容。</p>
        </div>
        <div class="message me">
          <span class="contact-avatar">我</span>
          <p class="bubble">可以。先做静态页面，后面再加登录、消息数据和发送逻辑。</p>
        </div>
        <div class="message">
          <span class="contact-avatar">陈</span>
          <p class="bubble">桌面端三栏很好用，手机端可以先只显示联系人列表，后面再做页面切换。</p>
        </div>
      </div>

      <footer class="composer">
        <div class="composer-toolbar">
          <button class="icon-button" title="表情" aria-label="表情">☺</button>
          <button class="icon-button" title="图片" aria-label="图片">▧</button>
          <button class="icon-button" title="文件" aria-label="文件">▤</button>
          <button class="icon-button" title="截图" aria-label="截图">□</button>
        </div>
        <div class="composer-area">
          <textarea id="messageInput" placeholder="输入消息..."></textarea>
          <button class="send-button" id="sendButton">发送</button>
        </div>
      </footer>
    </section>
  </main>

  <script>
    const contacts = document.querySelectorAll('.contact');
    const chatName = document.querySelector('#chatName');
    const chatStatus = document.querySelector('#chatStatus');
    const messages = document.querySelector('#messages');
    const input = document.querySelector('#messageInput');
    const sendButton = document.querySelector('#sendButton');

    contacts.forEach((contact) => {
      contact.addEventListener('click', () => {
        contacts.forEach((item) => item.classList.remove('active'));
        contact.classList.add('active');
        chatName.textContent = contact.dataset.name;
        chatStatus.textContent = contact.dataset.status;
      });
    });

    sendButton.addEventListener('click', () => {
      const text = input.value.trim();
      if (!text) {
        return;
      }

      const item = document.createElement('div');
      item.className = 'message me';
      item.innerHTML = '<span class="contact-avatar">我</span><p class="bubble"></p>';
      item.querySelector('.bubble').textContent = text;
      messages.appendChild(item);
      input.value = '';
      messages.scrollTop = messages.scrollHeight;
    });
  </script>
</body>
</html>
